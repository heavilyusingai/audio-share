name: Linux desktop

on:
  push:
    paths:
      - 'linux-gui/**'
      - 'server-core/**'
      - 'protos/**'
      - '.github/workflows/linux-desktop.yml'
  pull_request:
    paths:
      - 'linux-gui/**'
      - 'server-core/**'
      - 'protos/**'
      - '.github/workflows/linux-desktop.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the tested Arch/CachyOS prerelease'
        type: boolean
        default: false

jobs:
  arch:
    name: Arch Linux native build and GUI checks
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git base-devel cmake pkgconf pipewire protobuf asio spdlog cxxopts python python-gobject gtk3 iproute2 xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v4
      - name: Build native server without vcpkg
        working-directory: server-core
        run: |
          (cmake --preset linux-system-Release && cmake --build --preset linux-system-Release --parallel 2 && out/install/linux-system-Release/bin/as-cmd --version) > /tmp/build.log 2>&1 || {
            printf '### Native build failure\n```\n' >> "$GITHUB_STEP_SUMMARY"
            tail -100 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/build.log
            echo "::error::$(grep -Ei -A 5 'error|not found|could not find|failed' /tmp/build.log | tail -30 | tr '\n' '|')"
            exit 1
          }
          cat /tmp/build.log
      - name: Handle unavailable PipeWire daemon cleanly
        working-directory: server-core
        run: |
          set +e
          timeout 8s out/install/linux-system-Release/bin/as-cmd --list-endpoint > /tmp/pipewire.log 2>&1
          status=$?
          set -e
          cat /tmp/pipewire.log
          test "$status" -eq 1
          grep -q 'Cannot connect to PipeWire' /tmp/pipewire.log
      - name: Python tests
        if: always()
        run: python3 -m unittest discover -s linux-gui/tests -v
      - name: Desktop launcher installation smoke test
        if: always()
        run: |
          DESTDIR="$RUNNER_TEMP/stage" sh linux-gui/install.sh
          test -x "$RUNNER_TEMP/stage/usr/local/bin/audio-share-gui"
          test -f "$RUNNER_TEMP/stage/usr/local/share/applications/io.github.mkckr0.AudioShare.desktop"
          xvfb-run -a python3 linux-gui/tests/gui_smoke.py
      - name: Build and verify Arch release archive
        run: |
          sh linux-gui/package.sh
          cd server-core/out/install/linux-system-Release
          sha256sum -c audio-share-0.3.4-arch-linux-gui.tar.gz.sha256
          tar -tzf audio-share-0.3.4-arch-linux-gui.tar.gz | grep -E '/(bin/as-cmd|gui/audio-share-gui|gui/install.sh)$'
      - uses: actions/upload-artifact@v4
        with:
          name: arch-linux-gui
          path: |
            server-core/out/install/linux-system-Release/audio-share-0.3.4-arch-linux-gui.tar.gz
            server-core/out/install/linux-system-Release/audio-share-0.3.4-arch-linux-gui.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish Arch/CachyOS prerelease
    needs: arch
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/arena/0b80ef30-audio-share'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arch-linux-gui
          path: release_bin
      - name: Publish verified assets from this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(cat VERSION)" = 0.3.4
          cd release_bin
          sha256sum -c audio-share-0.3.4-arch-linux-gui.tar.gz.sha256
          cd ..
          gh release create v0.3.4-arch.1 --target "$GITHUB_SHA" --title 'Audio Share 0.3.4 — Arch Linux/CachyOS GUI' --prerelease --notes-file linux-gui/RELEASE_NOTES.md release_bin/*
